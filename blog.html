<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Blog - Mundo Automotriz</title>
        <link rel="stylesheet" href="estilos.css" />
        <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        />
        <style>
            /* Estilos para asegurar que la página del blog tenga un fondo oscuro */
            body {
                background-color: #0d1b2a; /* Azul Marino Oscuro */
            }
        </style>
    </head>
    <body>
        <main id="page-content">
            <!-- Cabecera (reutilizada) -->
            <header>
                <div class="header-content container">
                    <a href="/index.html" class="logo"><h1>Mundo Automotriz</h1></a>
                    <nav>
                        <ul>
                            <li><a href="/index.html">Inicio</a></li>
                            <li><a href="/blog.html">Blog</a></li>
                            <li><a href="/index.html#galeria">Galería</a></li>
                            <li><a href="/index.html#contacto">Contacto</a></li>
                        </ul>
                    </nav>
                    <button class="mobile-menu-btn" aria-label="Abrir menú">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                </div>
            </header>

            <!-- Contenido Principal del Blog -->
            <section id="blog-main" style="padding-top: 10rem">
                <div class="container">
                    <div class="section-title">
                        <h2>Nuestro Blog</h2>
                        <p>
                            Todos los artículos, análisis y reportajes sobre el
                            apasionante mundo del motor.
                        </p>
                    </div>
                    <!-- Barra de Búsqueda -->
                    <div class="search-bar-container">
                        <form id="search-form">
                            <input type="search" id="search-input" class="form-control" placeholder="Buscar artículos por título...">
                            <button type="submit" class="btn"><i class="fa-solid fa-magnifying-glass"></i></button>
                        </form>
                    </div>

                    <div class="card-container" id="all-posts-container">
                        <!-- Todos los artículos se cargarán aquí -->
                    </div>
                    <!-- Controles de Paginación -->
                    <div id="pagination-controls" class="text-center mt-3" style="display: none;">
                        <button id="prev-page-btn" class="btn btn-secondary">Anterior</button>
                        <span id="page-info" style="margin: 0 1rem; font-weight: 600;"></span>
                        <button id="next-page-btn" class="btn btn-secondary">Siguiente</button>
                    </div>
                </div>
            </section>
        </main>
        <script src="blog.js"></script>
        <script src="script.js"></script> <!-- Para el menú móvil -->
    </body>
</html>
